[versions]
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
junit = "5.11.0"
arrow = "1.2.4"
failgood = "0.9.1"
filepeek = "0.1.3"
jackson = "2.17.2"
minutest = "1.13.0"
mockk = "1.13.12"
protobuf = "4.27.3"
opentest4j = "1.3.0"
spring-boot = "3.3.2"

# Gradle plugins
dokka = "2.2.0"
kover = "0.9.9"
kotlinter = "5.6.0"
test-logger = "4.0.0"
ben-manes-versions = "0.54.0"
nexus-staging = "0.30.0"
nebula-publishing = "21.0.0"

[libraries]
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

opentest4j = { module = "org.opentest4j:opentest4j", version.ref = "opentest4j" }
filepeek = { module = "com.christophsturm:filepeek", version.ref = "filepeek" }
failgood = { module = "dev.failgood:failgood", version.ref = "failgood" }
minutest = { module = "dev.minutest:minutest", version.ref = "minutest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# buildSrc plugin dependencies (applied via buildSrc/build.gradle.kts)
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
nebula-publishing-plugin = { module = "com.netflix.nebula:nebula-publishing-plugin", version.ref = "nebula-publishing" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-plugin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
test-logger = { id = "com.adarshr.test-logger", version.ref = "test-logger" }
ben-manes-versions = { id = "com.github.ben-manes.versions", version.ref = "ben-manes-versions" }
nexus-staging = { id = "io.codearte.nexus-staging", version.ref = "nexus-staging" }
