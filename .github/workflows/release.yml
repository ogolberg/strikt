name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Publish to Sonatype
        run: ./gradlew -Pversion=${GITHUB_REF:11} publish
        env:
          ORG_GRADLE_PROJECT_ossrhToken: ${{ secrets.OSSRH_TOKEN }}
          ORG_GRADLE_PROJECT_ossrhTokenPassword: ${{ secrets.OSSRH_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
      - name: Release to Sonatype
        run: ./gradlew -Pversion=${GITHUB_REF:11} closeAndReleaseRepository
        env:
          ORG_GRADLE_PROJECT_ossrhToken: ${{ secrets.OSSRH_TOKEN }}
          ORG_GRADLE_PROJECT_ossrhTokenPassword: ${{ secrets.OSSRH_TOKEN_PASSWORD }}

  # The docs site (VitePress + Dokka) is built and deployed to GitHub Pages by
  # the docs workflow (docs.yml), which also runs on published releases.
